[project]
name = "ai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "anthropic>=0.98.0",
    "fastembed>=0.8.0",
    "google-genai>=1.72.0",
    "groq>=1.1.2",
    "instructor>=1.15.1",
    "ipykernel>=7.2.0",
    "langchain-anthropic>=1.4.4",
    "langchain-voyageai>=0.3.3",
    "langgraph>=1.2.4",
    "matplotlib>=3.10.9",
    "openai>=2.31.0",
    "pydantic>=2.13.0",
    "pydantic-settings>=2.13.1",
    "python-dotenv>=1.2.2",
    "qdrant-client>=1.17.1",
    "ragas>=0.4.3",
    "streamlit>=1.56.0",
    "voyageai>=0.3.7",
]

[tool.uv.workspace]
members = [
    "apps/api",
    "apps/chatbot_ui",
]

[dependency-groups]
dev = [
    "langsmith>=0.8.0",
    "matplotlib>=3.10.9",
    "qdrant-client>=1.17.1",
]
